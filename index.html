<script>

  pollMinVotes: 3

/* ==========================================================================
   APPLICATION STATE & DEFAULT BOARDS

var DEFAULT_BOARDS = [
  { slug: "b", title: "Random" },
  { slug: "ua", title: "Ukraine" },
  { slug: "pmr", title: "Pridnestrovie" },
  { slug: "tech", title: "Technology & Retro Web" }
];

var ADMIN_USERNAME = "admin";
var ADMIN_PASSWORD_INIT = "@!1Abeccod20122";
var memoryStore = {};

var state = {
  view: "board",
  currentBoard: "b",
  currentThreadId: null,
  boards: [],
  threads: {},
  comments: {},
  polls: {},
  user: null,
  profile: { nickname: "", bio: "", avatarUrl: "" }

/* ==========================================================================
   UTILITY & BROWSER COMPATIBILITY HELPERS
   ========================================================================== */
function storeGet(key) {
  try {
    return localStorage.getItem(key);
  } catch (e) {
    return memoryStore.hasOwnProperty(key) ? memoryStore[key] : null;
  }
}

function storeSet(key, val) {
  try {
    localStorage.setItem(key, val);
  } catch (e) {
    memoryStore[key] = val;
  }
}

function storeRemove(key) {
  try {
    localStorage.removeItem(key);
  } catch (e) {
    delete memoryStore[key];
  }
}

function isFirebaseConfigured() {
  return CONFIG.firebaseApiKey &&
         CONFIG.firebaseApiKey.indexOf("PASTE_") === -1 &&
         CONFIG.firebaseDbUrl &&
         CONFIG.firebaseDbUrl.indexOf("YOUR-PROJECT-ID") === -1;
}

function isImgbbConfigured() {
  return CONFIG.imgbbApiKey && CONFIG.imgbbApiKey.indexOf("PASTE_") === -1;
}

function showStatus(msg, isError) {
  var box = document.getElementById("statusBox");
  if (!msg) {
    box.style.display = "none";
    box.innerHTML = "";
    return;
  }
  box.style.display = "block";
  box.style.backgroundColor = isError ? "#FFD2D2" : "#FFE4C4";
  box.innerHTML = esc(msg);
}

function formatDbError(err, fallbackMsg) {
  if (!err) return fallbackMsg;
  var detail = "";
  if (err.data && typeof err.data === "object" && err.data.error) {
    detail = String(err.data.error);
  } else if (typeof err.data === "string") {
    detail = err.data;
  }
  if (err.status === 401) {
    return "Session expired or invalid token (401). Stale session cleared; please sign in again.";
  }
  if (err.status === 403 || detail.toLowerCase().indexOf("permission") !== -1) {
    return "Permission denied by Firebase Realtime Database rules (403).";
  }
  if (err.status === 404) {
    return "Firebase Realtime Database not found or deactivated (404). Check firebaseDbUrl in CONFIG.";
  }
  if (err.status === 0) {
    return "Network error. Host this file on GitHub Pages or check your connection.";
  }
  return fallbackMsg + (detail ? " (" + detail + ")" : "");
}

function esc(str) {
  if (str === null || str === undefined) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function safeUrl(url) {
  if (!url) return "";
  var trimmed = String(url).replace(/^\s+|\s+$/g, "");
  if (/^https?:\/\//i.test(trimmed)) {
    return trimmed;
  }
  return "";
}

function formatTime(ts) {
  if (!ts) return "";
  var d = new Date(ts);
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) +
         " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
}

function generateId() {
  return "id_" + (new Date().getTime()) + "_" + Math.floor(Math.random() * 100000);
}

function sanitizeSlug(raw) {
  return String(raw || "")
    .toLowerCase()
    .replace(/[^a-z0-9_]/g, "")
    .substring(0, 16);
}

function extractUsername(rawInput) {
  var clean = String(rawInput || "").replace(/^\s+|\s+$/g, "").toLowerCase();
  var atIndex = clean.indexOf("@");
  if (atIndex !== -1) {
    clean = clean.substring(0, atIndex);
  }
  clean = clean.replace(/[^a-z0-9._-]/g, "");
  if (!clean) clean = "user";
  return clean;
}

function usernameToEmail(rawInput) {
  return extractUsername(rawInput) + "@" + CONFIG.emailDomain;
}

/* ==========================================================================
   SESSION & STALE TOKEN AUTO-CLEAR MANAGEMENT
   ========================================================================== */
function saveSession() {
  if (state.user) {
    storeSet("ib_session", JSON.stringify(state.user));
  } else {
    storeRemove("ib_session");
  }
}

function clearStaleSession() {
  state.user = null;
  state.profile = { nickname: "", bio: "", avatarUrl: "" };
  storeRemove("ib_session");
}

function decodeJwtPayload(token) {
  if (!token || typeof token !== "string") return null;
  var parts = token.split(".");
  if (parts.length !== 3) return null;
  try {
    var b64 = parts[1].replace(/-/g, "+").replace(/_/g, "/");
    while (b64.length % 4 !== 0) {
      b64 += "=";
    }
    var jsonStr = atob(b64);
    return JSON.parse(jsonStr);
  } catch (e) {
    return null;
  }
}

function isTokenExpired(token) {
  var payload = decodeJwtPayload(token);
  if (!payload || !payload.exp) return true;
  var nowSeconds = Math.floor(new Date().getTime() / 1000);
  return nowSeconds >= (payload.exp - 60);
}

function loadSession() {
  try {
    var raw = storeGet("ib_session");
    if (!raw) return;
    var parsed = JSON.parse(raw);

    if (!parsed || typeof parsed !== "object" || !parsed.uid || !parsed.email) {
      clearStaleSession();
      return;
    }

    if (isFirebaseConfigured()) {
      // Clear local-mode tokens or mismatched email domain tokens automatically
      if (!parsed.idToken || parsed.idToken === "local_token") {
        clearStaleSession();
        return;
      }
      if (parsed.email.indexOf("@" + CONFIG.emailDomain) === -1) {
        clearStaleSession();
        return;
      }
      // If JWT token is malformed or expired without a refresh token, wipe immediately
      var jwtData = decodeJwtPayload(parsed.idToken);
      if (!jwtData && !parsed.refreshToken) {
        clearStaleSession();
        return;
      }
      if (isTokenExpired(parsed.idToken) && !parsed.refreshToken) {
        clearStaleSession();
        return;
      }
    }

    state.user = parsed;
  } catch (e) {
    clearStaleSession();
  }
}

function ensureFreshSession(callback) {
  if (!state.user || !isFirebaseConfigured()) {
    callback();
    return;
  }
  if (isTokenExpired(state.user.idToken)) {
    refreshAuthToken(function(err) {
      if (err) {
        clearStaleSession();
      }
      callback();
    });
  } else {
    callback();
  }
}

/* ==========================================================================
   CLASSIC XHR NETWORK CLIENT
   ========================================================================== */
function httpRequest(method, url, bodyObj, headers, callback) {
  var xhr = new XMLHttpRequest();
  xhr.open(method, url, true);
  if (headers) {
    for (var k in headers) {
      if (headers.hasOwnProperty(k)) {
        xhr.setRequestHeader(k, headers[k]);
      }
    }
  }
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      var data = null;
      try {
        data = xhr.responseText ? JSON.parse(xhr.responseText) : null;
      } catch (e) {
        data = xhr.responseText;
      }
      if (xhr.status >= 200 && xhr.status < 300) {
        callback(null, data);
      } else {
        callback({ status: xhr.status, data: data }, null);
      }
    }
  };
  xhr.onerror = function() {
    callback({ status: 0, data: "Network error" }, null);
  };
  if (bodyObj !== null && bodyObj !== undefined) {
    if (typeof bodyObj === "string") {
      xhr.send(bodyObj);
    } else {
      xhr.setRequestHeader("Content-Type", "application/json");
      xhr.send(JSON.stringify(bodyObj));
    }
  } else {
    xhr.send();
  }
}

/* ==========================================================================
   DATABASE LAYER (FIREBASE REALTIME DB + LOCAL CACHE / FALLBACK)
   ========================================================================== */
function cacheWriteLocal(path, data) {
  try {
    var all = JSON.parse(storeGet("ib_local_db") || "{}");
    var parts = path.split("/");
    var cleanParts = [];
    for (var i = 0; i < parts.length; i++) {
      if (parts[i]) cleanParts.push(parts[i]);
    }
    if (cleanParts.length === 0) return;
    var target = all;
    for (var k = 0; k < cleanParts.length - 1; k++) {
      if (!target[cleanParts[k]]) target[cleanParts[k]] = {};
      target = target[cleanParts[k]];
    }
    target[cleanParts[cleanParts.length - 1]] = data;
    storeSet("ib_local_db", JSON.stringify(all));
  } catch (e) {}
}

function cacheReadLocal(path) {
  try {
    var all = JSON.parse(storeGet("ib_local_db") || "{}");
    var parts = path.split("/");
    var cur = all;
    for (var i = 0; i < parts.length; i++) {
      if (!parts[i]) continue;
      cur = cur ? cur[parts[i]] : null;
    }
    return cur || null;
  } catch (e) {
    return null;
  }
}

function dbGet(path, callback) {
  if (!isFirebaseConfigured()) {
    callback(null, cacheReadLocal(path));
    return;
  }
  var url = CONFIG.firebaseDbUrl + "/" + path + ".json";
  httpRequest("GET", url, null, null, function(err, data) {
    if (!err) {
      cacheWriteLocal(path, data);
      callback(null, data);
    } else {
      callback(err, cacheReadLocal(path));
    }
  });
}

function dbWrite(method, path, payload, callback) {
  if (!isFirebaseConfigured()) {
    try {
      var all = JSON.parse(storeGet("ib_local_db") || "{}");
      var parts = path.split("/");
      var cleanParts = [];
      for (var i = 0; i < parts.length; i++) {
        if (parts[i]) cleanParts.push(parts[i]);
      }
      if (method === "DELETE") {
        var parent = all;
        for (var j = 0; j < cleanParts.length - 1; j++) {
          if (!parent[cleanParts[j]]) parent[cleanParts[j]] = {};
          parent = parent[cleanParts[j]];
        }
        delete parent[cleanParts[cleanParts.length - 1]];
      } else {
        var target = all;
        for (var k = 0; k < cleanParts.length - 1; k++) {
          if (!target[cleanParts[k]]) target[cleanParts[k]] = {};
          target = target[cleanParts[k]];
        }
        var leaf = cleanParts[cleanParts.length - 1];
        if (method === "PATCH" && typeof target[leaf] === "object" && target[leaf] !== null) {
          for (var key in payload) {
            if (payload.hasOwnProperty(key)) target[leaf][key] = payload[key];
          }
        } else {
          target[leaf] = payload;
        }
      }
      storeSet("ib_local_db", JSON.stringify(all));
      callback(null, payload);
    } catch (e) {
      callback(e, null);
    }
    return;
  }

  var authParam = (state.user && state.user.idToken) ? ("?auth=" + encodeURIComponent(state.user.idToken)) : "";
  var url = CONFIG.firebaseDbUrl + "/" + path + ".json" + authParam;
  httpRequest(method, url, payload, null, function(err, res) {
    if (err && err.status === 401) {
      if (state.user && state.user.refreshToken) {
        refreshAuthToken(function(refErr) {
          if (refErr) {
            clearStaleSession();
            renderTopNav();
            callback(err, null);
          } else {
            var retryUrl = CONFIG.firebaseDbUrl + "/" + path + ".json?auth=" + encodeURIComponent(state.user.idToken);
            httpRequest(method, retryUrl, payload, null, callback);
          }
        });
      } else {
        clearStaleSession();
        renderTopNav();
        callback(err, null);
      }
    } else {
      callback(err, res);
    }
  });
}

/* ==========================================================================
   AUTHENTICATION (NAME -> NAME@FEMBOORU.UA + PASSWORD)
   ========================================================================== */
function refreshAuthToken(callback) {
  if (!state.user || !state.user.refreshToken || !isFirebaseConfigured()) {
    clearStaleSession();
    callback("No refresh token");
    return;
  }
  var url = "https://securetoken.googleapis.com/v1/token?key=" + encodeURIComponent(CONFIG.firebaseApiKey);
  var body = "grant_type=refresh_token&refresh_token=" + encodeURIComponent(state.user.refreshToken);
  httpRequest("POST", url, body, { "Content-Type": "application/x-www-form-urlencoded" }, function(err, data) {
    if (err || !data || !data.id_token) {
      clearStaleSession();
      callback(err || "Session expired");
      return;
    }
    state.user.idToken = data.id_token;
    state.user.refreshToken = data.refresh_token;
    saveSession();
    callback(null);
  });
}

function handleAuth(mode) {
  var usernameInput = document.getElementById("authUsername");
  var passwordInput = document.getElementById("authPassword");
  var rawName = String(usernameInput.value || "").replace(/^\s+|\s+$/g, "");
  var password = String(passwordInput.value || "");

  if (!rawName || !password) {
    showStatus("Enter both your name and password.", true);
    return;
  }

  var username = extractUsername(rawName);
  var email = usernameToEmail(username);
  var isAdminAttempt = (username === ADMIN_USERNAME && password === ADMIN_PASSWORD_INIT);

  // Always clear any previous stale session before authenticating
  clearStaleSession();

  if (!isFirebaseConfigured()) {
    var localUid = "local_" + username;
    state.user = {
      uid: localUid,
      username: username,
      email: email,
      idToken: "local_token",
      refreshToken: "",
      isAdmin: isAdminAttempt
    };
    saveSession();
    loadUserProfile(function() {
      dbWrite("PATCH", "users/" + localUid, {
        username: username,
        email: email,
        nickname: state.profile.nickname || username
      }, function() {});
      showStatus("Signed in locally as " + email + (isAdminAttempt ? " [Admin]" : "") + ".", false);
      switchView("board");
    });
    return;
  }

  var endpoint = (mode === "register") ? "signUp" : "signInWithPassword";
  var url = "https://identitytoolkit.googleapis.com/v1/accounts:" + endpoint + "?key=" + encodeURIComponent(CONFIG.firebaseApiKey);
  var payload = { email: email, password: password, returnSecureToken: true };

  showStatus("Connecting as " + email + "...", false);
  httpRequest("POST", url, payload, null, function(err, data) {
    if (err && mode === "login" && isAdminAttempt) {
      var signUpUrl = "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=" + encodeURIComponent(CONFIG.firebaseApiKey);
      httpRequest("POST", signUpUrl, payload, null, function(regErr, regData) {
        if (regErr || !regData) {
          showStatus("Admin setup failed. Enable Email/Password sign-in in Firebase Authentication.", true);
          return;
        }
        finalizeAuthSuccess(username, email, regData, true);
      });
      return;
    }

    if (err || !data || !data.idToken) {
      var errMsg = (err && err.data && err.data.error && err.data.error.message) ? err.data.error.message : "Authentication failed.";
      showStatus("Error: " + errMsg, true);
      return;
    }

    finalizeAuthSuccess(username, email, data, email === (ADMIN_USERNAME + "@" + CONFIG.emailDomain));
  });
}

function finalizeAuthSuccess(username, email, data, isAdmin) {
  state.user = {
    uid: data.localId,
    username: username,
    email: email,
    idToken: data.idToken,
    refreshToken: data.refreshToken,
    isAdmin: isAdmin
  };
  saveSession();
  loadUserProfile(function() {
    var nick = state.profile.nickname || username;
    state.profile.nickname = nick;
    dbWrite("PATCH", "users/" + state.user.uid, {
      username: username,
      email: email,
      nickname: nick
    }, function() {});
    showStatus("Welcome, " + username + " (" + email + ")" + (isAdmin ? " [Admin]" : "") + "!", false);
    switchView("board");
  });
}

function logoutUser() {
  clearStaleSession();
  showStatus("Logged out.", false);
  renderAll();
}

function loadUserProfile(callback) {
  if (!state.user) {
    if (callback) callback();
    return;
  }
  dbGet("users/" + state.user.uid, function(err, data) {
    if (data) {
      state.profile = {
        nickname: data.nickname || state.user.username,
        bio: data.bio || "",
        avatarUrl: data.avatarUrl || ""
      };
    } else {
      state.profile = { nickname: state.user.username, bio: "", avatarUrl: "" };
    }
    if (callback) callback();
  });
}

/* ==========================================================================
   IMGBB IMAGE UPLOADER (IMAGES & AVATARS ONLY)
   ========================================================================== */
function uploadImageToImgbb(fileInput, callback) {
  if (!fileInput || !fileInput.files || !fileInput.files[0]) {
    callback(null, "");
    return;
  }
  var file = fileInput.files[0];
  if (file.type.indexOf("image/") !== 0) {
    callback("Only image files are allowed for upload.", null);
    return;
  }
  if (typeof FileReader === "undefined") {
    callback("Your browser does not support local file reading.", null);
    return;
  }

  var reader = new FileReader();
  reader.onload = function(evt) {
    var dataUrl = evt.target.result;
    if (!isImgbbConfigured()) {
      callback(null, dataUrl);
      return;
    }
    var base64Data = dataUrl.split(",")[1];
    var url = "https://api.imgbb.com/1/upload?key=" + encodeURIComponent(CONFIG.imgbbApiKey);
    var body = "image=" + encodeURIComponent(base64Data);
    showStatus("Uploading image to ImgBB...", false);
    httpRequest("POST", url, body, { "Content-Type": "application/x-www-form-urlencoded" }, function(err, res) {
      if (err || !res || !res.data || !res.data.url) {
        callback("ImgBB upload failed. Check your ImgBB API key.", null);
        return;
      }
      callback(null, res.data.url);
    });
  };
  reader.onerror = function() {
    callback("Could not read selected image file.", null);
  };
  reader.readAsDataURL(file);
}

/* ==========================================================================
   VIDEO LINK RENDERER (EXTERNAL LINKS ONLY, NEVER UPLOADED TO FIREBASE)
   ========================================================================== */
function renderVideoHtml(rawUrl) {
  var url = safeUrl(rawUrl);
  if (!url) return "";

  var ytMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);
  if (ytMatch && ytMatch[1]) {
    var embedSrc = "https://www.youtube.com/embed/" + esc(ytMatch[1]);
    return '<div class="video-box">' +
           '<div class="muted">Video Link: <a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(url) + '</a></div>' +
           '<iframe width="360" height="215" src="' + embedSrc + '" frameborder="0" allowfullscreen></iframe>' +
           '</div>';
  }

  if (/\.(mp4|webm|ogg)(\?.*)?$/i.test(url)) {
    return '<div class="video-box">' +
           '<div class="muted">Video Link: <a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(url) + '</a></div>' +
           '<video width="360" controls preload="metadata" src="' + esc(url) + '"></video>' +
           '</div>';
  }

  return '<div class="video-box">' +
         '<strong>[Video Link]</strong> <a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(url) + '</a>' +
         '</div>';
}

/* ==========================================================================
   DATA LOADING & SYNCHRONIZATION
   ========================================================================== */
function refreshAllData(callback) {
  dbGet("boards", function(errB, customBoards) {
    if (errB && errB.status === 404) {
      showStatus(formatDbError(errB, "Database unavailable."), true);
    }
    var merged = [];
    var seen = {};
    for (var i = 0; i < DEFAULT_BOARDS.length; i++) {
      merged.push(DEFAULT_BOARDS[i]);
      seen[DEFAULT_BOARDS[i].slug] = true;
    }
    if (customBoards) {
      for (var slug in customBoards) {
        if (customBoards.hasOwnProperty(slug) && customBoards[slug] && !seen[slug]) {
          merged.push({
            slug: slug,
            title: customBoards[slug].title || slug,
            custom: true
          });
          seen[slug] = true;
        }
      }
    }
    state.boards = merged;

    dbGet("threads", function(errT, threadsData) {
      state.threads = threadsData || {};
      dbGet("comments", function(errC, commentsData) {
        state.comments = commentsData || {};
        dbGet("polls", function(errP, pollsData) {
          state.polls = pollsData || {};
          if (callback) callback();
        });
      });
    });
  });
}

/* ==========================================================================
   BOARD, THREAD, COMMENT, LIKE & POLL ACTIONS
   ========================================================================== */
function createThread() {
  if (!state.user) {
    showStatus("Please log in or register before posting.", true);
    return;
  }
  var subject = String(document.getElementById("newThreadSubject").value || "").replace(/^\s+|\s+$/g, "");
  var text = String(document.getElementById("newThreadText").value || "").replace(/^\s+|\s+$/g, "");
  var videoUrl = safeUrl(document.getElementById("newThreadVideo").value);
  var fileInput = document.getElementById("newThreadImage");

  if (!text && !videoUrl && (!fileInput.files || !fileInput.files[0])) {
    showStatus("Enter text, select an image, or provide a video link.", true);
    return;
  }

  uploadImageToImgbb(fileInput, function(imgErr, imageUrl) {
    if (imgErr) {
      showStatus(imgErr, true);
      return;
    }
    var threadId = generateId();
    var now = new Date().getTime();
    var threadObj = {
      id: threadId,
      board: state.currentBoard,
      subject: subject,
      text: text,
      imageUrl: imageUrl || "",
      videoUrl: videoUrl || "",
      uid: state.user.uid,
      authorName: state.profile.nickname || state.user.username,
      authorAvatar: state.profile.avatarUrl || "",
      isAdminPost: !!state.user.isAdmin,
      createdAt: now,
      bumpedAt: now
    };

    dbWrite("PUT", "threads/" + threadId, threadObj, function(err) {
      if (err) {
        showStatus(formatDbError(err, "Failed to create thread."), true);
        return;
      }
      showStatus("Thread created.", false);
      refreshAllData(renderAll);
    });
  });
}

function createComment(threadId) {
  if (!state.user) {
    showStatus("Please log in or register to reply.", true);
    return;
  }
  var text = String(document.getElementById("replyText").value || "").replace(/^\s+|\s+$/g, "");
  var videoUrl = safeUrl(document.getElementById("replyVideo").value);
  var fileInput = document.getElementById("replyImage");

  if (!text && !videoUrl && (!fileInput.files || !fileInput.files[0])) {
    showStatus("Enter reply text, select an image, or paste a video link.", true);
    return;
  }

  uploadImageToImgbb(fileInput, function(imgErr, imageUrl) {
    if (imgErr) {
      showStatus(imgErr, true);
      return;
    }
    var commentId = generateId();
    var now = new Date().getTime();
    var commentObj = {
      id: commentId,
      text: text,
      imageUrl: imageUrl || "",
      videoUrl: videoUrl || "",
      uid: state.user.uid,
      authorName: state.profile.nickname || state.user.username,

    };

}

function deleteThread(threadId) {
  var thread = state.threads[threadId];
  if (!thread || !state.user) return;
  if (thread.uid !== state.user.uid && !state.user.isAdmin) {
    showStatus("You can only delete your own threads.", true);
    return;
  }
  if (!confirm("Delete this thread and all its replies?")) return;

  dbWrite("DELETE", "threads/" + threadId, null, function(err) {
    if (err) {
      showStatus(formatDbError(err, "Delete failed."), true);
      return;
    }
    dbWrite("DELETE", "comments/" + threadId, null, function() {
      if (state.view === "thread" && state.currentThreadId === threadId) {
        state.view = "board";
        state.currentThreadId = null;
      }
      showStatus("Thread deleted.", false);
      refreshAllData(renderAll);
    });
  });
}

function deleteComment(threadId, commentId) {
  var threadComments = state.comments[threadId] || {};
  var comment = threadComments[commentId];
  if (!comment || !state.user) return;
  if (comment.uid !== state.user.uid && !state.user.isAdmin) {
    showStatus("You can only delete your own comments.", true);
    return;
  }
  if (!confirm("Delete this comment?")) return;

  dbWrite("DELETE", "comments/" + threadId + "/" + commentId, null, function(err) {
    if (err) {
      showStatus(formatDbError(err, "Delete failed."), true);
      return;
    }
    showStatus("Comment deleted.", false);
    refreshAllData(renderAll);
  });
}

function toggleThreadLike(threadId) {
  if (!state.user) {
    showStatus("Log in to like posts.", true);
    return;
  }
  var thread = state.threads[threadId];
  if (!thread) return;
  var uid = state.user.uid;
  var alreadyLiked = thread.likes && thread.likes[uid];
  var method = alreadyLiked ? "DELETE" : "PUT";
  var payload = alreadyLiked ? null : true;

  dbWrite(method, "threads/" + threadId + "/likes/" + uid, payload, function(err) {
    if (err) {
      showStatus(formatDbError(err, "Could not update like."), true);
      return;
    }
    refreshAllData(renderAll);
  });
}

function toggleCommentLike(threadId, commentId) {
  if (!state.user) {
    showStatus("Log in to like posts.", true);
    return;
  }
  var threadComments = state.comments[threadId];
  if (!threadComments || !threadComments[commentId]) return;
  var comment = threadComments[commentId];
  var uid = state.user.uid;
  var alreadyLiked = comment.likes && comment.likes[uid];
  var method = alreadyLiked ? "DELETE" : "PUT";
  var payload = alreadyLiked ? null : true;

  dbWrite(method, "comments/" + threadId + "/" + commentId + "/likes/" + uid, payload, function(err) {
    if (err) {
      showStatus(formatDbError(err, "Could not update like."), true);
      return;
    }
    refreshAllData(renderAll);
  });
}

function createBoardAdmin() {

function deleteCustomBoard(slug) {

function createBoardPoll() {
  if (!state.user) {
    showStatus("Log in to propose a board poll.", true);
    return;
  }
  var slug = sanitizeSlug(document.getElementById("pollBoardSlug").value);
  var title = String(document.getElementById("pollBoardTitle").value || "").replace(/^\s+|\s+$/g, "");
  var desc = String(document.getElementById("pollBoardDesc").value || "").replace(/^\s+|\s+$/g, "");

  if (!slug || !title) {
    showStatus("Board slug and title are required.", true);
    return;
  }
  for (var i = 0; i < state.boards.length; i++) {
    if (state.boards[i].slug === slug) {
      showStatus("Board /" + slug + "/ already exists.", true);
      return;
    }
  }

  var initialVotes = {};
  initialVotes[state.user.uid] = "yes";

  var pollObj = {
    slug: slug,
    title: title,
    description: desc,
    createdBy: state.user.uid,
    creatorName: state.profile.nickname || state.user.username,
    createdAt: new Date().getTime(),
    status: "open",
    votes: initialVotes
  };

  dbWrite("PUT", "polls/" + slug, pollObj, function(err) {
    if (err) {
      showStatus(formatDbError(err, "Could not create poll."), true);
      return;
    }
    showStatus("Board poll for /" + slug + "/ created!", false);
    refreshAllData(renderAll);
  });
}

function voteOnPoll(slug, choice) {
  if (!state.user) {
    showStatus("Log in to vote on board polls.", true);
    return;
  }
  var poll = state.polls[slug];
  if (!poll) return;

  dbWrite("PUT", "polls/" + slug + "/votes/" + state.user.uid, choice, function(err) {
    if (err) {
      showStatus(formatDbError(err, "Failed to record vote."), true);
      return;
    }
    dbGet("polls/" + slug, function(getErr, freshPoll) {
      if (!freshPoll || !freshPoll.votes) {
        refreshAllData(renderAll);
        return;
      }
      var yesCount = 0;
      var noCount = 0;
      for (var uid in freshPoll.votes) {
        if (freshPoll.votes.hasOwnProperty(uid)) {
          if (freshPoll.votes[uid] === "yes") yesCount++;
          else if (freshPoll.votes[uid] === "no") noCount++;
        }
      }
      var totalVotes = yesCount + noCount;
      if (freshPoll.status !== "approved" && totalVotes >= CONFIG.pollMinVotes && yesCount > noCount) {
        var newBoard = {
          slug: slug,
          title: freshPoll.title,
          createdBy: freshPoll.createdBy,
          createdAt: new Date().getTime()
        };
        dbWrite("PUT", "boards/" + slug, newBoard, function() {
          dbWrite("PATCH", "polls/" + slug, { status: "approved" }, function() {
            showStatus("Majority agreed! Board /" + slug + "/ has been automatically created.", false);
            refreshAllData(renderAll);
          });
        });
      } else {
        showStatus("Vote recorded.", false);
        refreshAllData(renderAll);
      }
    });
  });
}

function saveUserProfile() {
  if (!state.user) return;
  var nickname = String(document.getElementById("profNickname").value || "").replace(/^\s+|\s+$/g, "") || state.user.username;
  var bio = String(document.getElementById("profBio").value || "").replace(/^\s+|\s+$/g, "");
  var fileInput = document.getElementById("profAvatarFile");

  uploadImageToImgbb(fileInput, function(imgErr, uploadedUrl) {
    if (imgErr) {
      showStatus(imgErr, true);
      return;
    }
    var finalAvatar = uploadedUrl || state.profile.avatarUrl || "";
    var updates = {
      username: state.user.username,
      email: state.user.email,
      nickname: nickname,
      bio: bio,
      avatarUrl: finalAvatar
    };
    dbWrite("PATCH", "users/" + state.user.uid, updates, function(err) {
      if (err) {
        showStatus(formatDbError(err, "Failed to save profile."), true);
        return;
      }
      state.profile.nickname = nickname;
      state.profile.bio = bio;
      state.profile.avatarUrl = finalAvatar;
      showStatus("Profile updated.", false);
      renderAll();
    });
  });
}

/* ==========================================================================
   VIEW NAVIGATION & RENDERING
   ========================================================================== */
function switchView(viewName, param) {
  showStatus("", false);
  state.view = viewName;
  if (viewName === "board" && param) {
    state.currentBoard = param;
    state.currentThreadId = null;
  } else if (viewName === "thread" && param) {
    state.currentThreadId = param;
  }
  renderAll();
}

function countLikes(likesObj) {
  if (!likesObj) return 0;
  var c = 0;
  for (var k in likesObj) {
    if (likesObj.hasOwnProperty(k) && likesObj[k]) c++;
  }
  return c;
}

function renderTopNav() {
  var html = "[ ";
  for (var i = 0; i < state.boards.length; i++) {
    var b = state.boards[i];
    html += '<a onclick="switchView(\'board\', \'' + esc(b.slug) + '\')">/' + esc(b.slug) + '/</a> ';
  }
  html += "] &nbsp; ";
  html += '[ <a onclick="switchView(\'polls\')">Board Polls</a> ] &nbsp; ';

  if (state.user) {
    html += '[ <a onclick="switchView(\'profile\')">Profile (' + esc(state.profile.nickname || state.user.username) + ')</a> ] &nbsp; ';
    html += '[ <a onclick="logoutUser()">Logout</a> ]';
  } else {
    html += '[ <a onclick="switchView(\'auth\')">Login / Register</a> ]';
  }

  if (!isFirebaseConfigured()) {
    html += ' <span class="muted">(Local Mode)</span>';
  }
  document.getElementById("topNav").innerHTML = html;
}

function renderBoardView() {
  var boardObj = { slug: state.currentBoard, title: state.currentBoard };
  for (var i = 0; i < state.boards.length; i++) {
    if (state.boards[i].slug === state.currentBoard) {
      boardObj = state.boards[i];
      break;
    }
  }

  var html = '<div class="board-banner">/' + esc(boardObj.slug) + '/ &mdash; ' + esc(boardObj.title) + '</div>';

  html += '<div class="box-panel">';
  html += '<h3>Start a New Thread</h3>';
  if (!state.user) {
    html += '<div>You must <a onclick="switchView(\'auth\')">Log In or Register</a> to create threads, comment, or like posts.</div>';
  } else {
    html += '<table class="form-table">';
    html += '<tr><td class="form-label">Subject</td><td><input type="text" id="newThreadSubject" maxlength="100" placeholder="Optional subject"></td></tr>';
    html += '<tr><td class="form-label">Comment</td><td><textarea id="newThreadText" placeholder="Write your post..."></textarea></td></tr>';
    html += '<tr><td class="form-label">Image Upload</td><td><input type="file" id="newThreadImage" accept="image/*"></td></tr>';
    html += '<tr><td class="form-label">Video Link</td><td><input type="text" id="newThreadVideo" placeholder="https://youtube.com/... or direct .mp4/.webm link"></td></tr>';
    html += '<tr><td class="form-label">Submit</td><td><button onclick="createThread()">Post Thread</button></td></tr>';
    html += '</table>';
  }
  html += '</div>';

  var list = [];
  for (var id in state.threads) {
    if (state.threads.hasOwnProperty(id)) {
      var t = state.threads[id];
      if (t && t.board === state.currentBoard) {
        list.push(t);
      }
    }
  }
  list.sort(function(a, b) {
    return (b.bumpedAt || b.createdAt || 0) - (a.bumpedAt || a.createdAt || 0);
  });

  if (list.length === 0) {
    html += '<div style="text-align:center; padding: 20px;">No threads on /' + esc(boardObj.slug) + '/ yet. Start the first one above!</div>';
    return html;
  }

  for (var j = 0; j < list.length; j++) {
    html += renderThreadBlock(list[j], false);
  }
  return html;
}

function renderThreadBlock(thread, isSingleView) {
  var threadCommentsMap = state.comments[thread.id] || {};
  var commentsList = [];
  for (var cid in threadCommentsMap) {
    if (threadCommentsMap.hasOwnProperty(cid) && threadCommentsMap[cid]) {
      commentsList.push(threadCommentsMap[cid]);
    }
  }
  commentsList.sort(function(a, b) {
    return (a.createdAt || 0) - (b.createdAt || 0);
  });

  var likeCount = countLikes(thread.likes);
  var userLiked = state.user && thread.likes && thread.likes[state.user.uid];
  var canDelete = state.user && (state.user.uid === thread.uid || state.user.isAdmin);

  var html = '<div class="thread-item">';
  html += '<div class="post-header">';
  if (safeUrl(thread.authorAvatar) || (thread.authorAvatar && thread.authorAvatar.indexOf("data:image/") === 0)) {
    html += '<img class="avatar-thumb" src="' + esc(thread.authorAvatar) + '" alt="avatar">';
  }
  if (thread.subject) {
    html += '<span class="post-subject">' + esc(thread.subject) + '</span> ';
  }
  html += '<span class="poster-name">' + esc(thread.authorName || "Anonymous") + '</span>';
  if (thread.isAdminPost) {
    html += '<span class="admin-badge">ADMIN</span>';
  }
  html += ' <span class="muted">' + formatTime(thread.createdAt) + '</span> ';
  html += ' No.' + esc(thread.id.replace("id_", "")) + ' ';
  if (!isSingleView) {
    html += '[<a onclick="switchView(\'thread\', \'' + esc(thread.id) + '\')">Reply (' + commentsList.length + ')</a>] ';
  }
  html += '[<a onclick="toggleThreadLike(\'' + esc(thread.id) + '\')">' +
          (userLiked ? 'Unlike' : 'Like') + ' (' + likeCount + ')</a>]';
  if (canDelete) {
    html += ' [<a style="color:#CC0000;" onclick="deleteThread(\'' + esc(thread.id) + '\')">Delete</a>]';
  }
  html += '</div>';

  if (thread.imageUrl) {
    html += '<div class="post-media"><a href="' + esc(thread.imageUrl) + '" target="_blank" rel="noopener">' +
            '<img src="' + esc(thread.imageUrl) + '" alt="image"></a></div>';
  }
  if (thread.text) {
    html += '<div class="post-body">' + esc(thread.text) + '</div>';
  }
  if (thread.videoUrl) {
    html += renderVideoHtml(thread.videoUrl);
  }
  html += '<div class="post-actions"></div>';

  var startIndex = isSingleView ? 0 : Math.max(0, commentsList.length - 3);
  if (!isSingleView && startIndex > 0) {
    html += '<div class="muted" style="margin-left:24px;">' + startIndex + ' earlier replies omitted. ' +
            '<a onclick="switchView(\'thread\', \'' + esc(thread.id) + '\')">Click here to view full thread</a>.</div>';
  }

  for (var k = startIndex; k < commentsList.length; k++) {
    html += renderCommentBlock(thread.id, commentsList[k]);
  }

  html += '</div>';
  return html;
}

function renderCommentBlock(threadId, comment) {
  var likeCount = countLikes(comment.likes);
  var userLiked = state.user && comment.likes && comment.likes[state.user.uid];
  var canDelete = state.user && (state.user.uid === comment.uid || state.user.isAdmin);

  var html = '<div class="reply-box">';
  html += '<div class="post-header">';
  if (safeUrl(comment.authorAvatar) || (comment.authorAvatar && comment.authorAvatar.indexOf("data:image/") === 0)) {
    html += '<img class="avatar-thumb" src="' + esc(comment.authorAvatar) + '" alt="avatar">';
  }
  html += '<span class="poster-name">' + esc(comment.authorName || "Anonymous") + '</span>';
  if (comment.isAdminPost) {
    html += '<span class="admin-badge">ADMIN</span>';
  }
  html += ' <span class="muted">' + formatTime(comment.createdAt) + '</span> ';
  html += '[<a onclick="toggleCommentLike(\'' + esc(threadId) + '\', \'' + esc(comment.id) + '\')">' +
          (userLiked ? 'Unlike' : 'Like') + ' (' + likeCount + ')</a>]';
  if (canDelete) {
    html += ' [<a style="color:#CC0000;" onclick="deleteComment(\'' + esc(threadId) + '\', \'' + esc(comment.id) + '\')">Delete</a>]';
  }
  html += '</div>';

  if (comment.imageUrl) {
    html += '<div class="post-media"><a href="' + esc(comment.imageUrl) + '" target="_blank" rel="noopener">' +
            '<img src="' + esc(comment.imageUrl) + '" alt="reply image"></a></div>';
  }
  if (comment.text) {
    html += '<div class="post-body">' + esc(comment.text) + '</div>';
  }
  if (comment.videoUrl) {
    html += renderVideoHtml(comment.videoUrl);
  }
  html += '</div>';
  return html;
}

function renderSingleThreadView() {
  var thread = state.threads[state.currentThreadId];
  if (!thread) {
    return '<div class="box-panel">Thread not found. <a onclick="switchView(\'board\', \'' + esc(state.currentBoard) + '\')">Return to board</a>.</div>';
  }

  var html = '<div style="margin-bottom:10px;">[<a onclick="switchView(\'board\', \'' + esc(thread.board) + '\')">&larr; Return to /' + esc(thread.board) + '/</a>]</div>';
  html += renderThreadBlock(thread, true);

  html += '<div class="box-panel">';
  html += '<h3>Post a Reply</h3>';
  if (!state.user) {
    html += '<div>Please <a onclick="switchView(\'auth\')">Log In or Register</a> to reply.</div>';
  } else {
    html += '<table class="form-table">';
    html += '<tr><td class="form-label">Comment</td><td><textarea id="replyText" placeholder="Write your reply..."></textarea></td></tr>';
    html += '<tr><td class="form-label">Image Upload</td><td><input type="file" id="replyImage" accept="image/*"></td></tr>';
    html += '<tr><td class="form-label">Video Link</td><td><input type="text" id="replyVideo" placeholder="https://youtube.com/... or direct .mp4/.webm link"></td></tr>';
    html += '<tr><td class="form-label">Submit</td><td><button onclick="createComment(\'' + esc(thread.id) + '\')">Post Reply</button></td></tr>';
    html += '</table>';
  }
  html += '</div>';
  return html;
}

function renderPollsView() {
  var html = '<div class="board-banner">Community Board Polls &amp; Board Management</div>';

  if (state.user && state.user.isAdmin) {
    html += '<div class="box-panel">';
    html += '<h3>Admin Panel: Create or Remove Boards Immediately</h3>';
    html += '<table class="form-table">';
    html += '<tr><td class="form-label">Board Slug</td><td><input type="text" id="adminBoardSlug" maxlength="16" placeholder="e.g. music"></td></tr>';
    html += '<tr><td class="form-label">Board Title</td><td><input type="text" id="adminBoardTitle" maxlength="40" placeholder="e.g. Music & Audio"></td></tr>';
    html += '<tr><td class="form-label">Action</td><td><button onclick="createBoardAdmin()">Create Board Now</button></td></tr>';
    html += '</table>';

    var hasCustom = false;
    var customListHtml = '<div style="margin-top:8px;"><strong>Custom Boards:</strong> ';
    for (var i = 0; i < state.boards.length; i++) {
      if (state.boards[i].custom) {
        hasCustom = true;
        customListHtml += '/' + esc(state.boards[i].slug) + '/ [<a style="color:#CC0000;" onclick="deleteCustomBoard(\'' + esc(state.boards[i].slug) + '\')">Remove</a>] &nbsp; ';
      }
    }
    customListHtml += '</div>';
    if (hasCustom) html += customListHtml;
    html += '</div>';
  }

  html += '<div class="box-panel">';
  html += '<h3>Propose a New Community Board</h3>';
  html += '<p class="muted">If at least ' + CONFIG.pollMinVotes + ' users vote and the majority agrees, the board is automatically created without needing an admin.</p>';
  if (!state.user) {
    html += '<div>Please <a onclick="switchView(\'auth\')">Log In or Register</a> to propose or vote on new boards.</div>';
  } else {
    html += '<table class="form-table">';
    html += '<tr><td class="form-label">Board Slug</td><td><input type="text" id="pollBoardSlug" maxlength="16" placeholder="e.g. odesa"></td></tr>';
    html += '<tr><td class="form-label">Board Title</td><td><input type="text" id="pollBoardTitle" maxlength="40" placeholder="e.g. Odesa & Black Sea"></td></tr>';
    html += '<tr><td class="form-label">Description</td><td><input type="text" id="pollBoardDesc" maxlength="140" placeholder="Short reason for creating this board"></td></tr>';
    html += '<tr><td class="form-label">Submit</td><td><button onclick="createBoardPoll()">Start Poll</button></td></tr>';
    html += '</table>';
  }
  html += '</div>';

  html += '<div style="max-width:620px; margin:0 auto;">';
  var hasPolls = false;
  for (var slug in state.polls) {
    if (state.polls.hasOwnProperty(slug) && state.polls[slug]) {
      hasPolls = true;
      var p = state.polls[slug];
      var yesCount = 0;
      var noCount = 0;
      var userVote = null;
      if (p.votes) {
        for (var uid in p.votes) {
          if (p.votes.hasOwnProperty(uid)) {
            if (p.votes[uid] === "yes") yesCount++;
            else if (p.votes[uid] === "no") noCount++;
            if (state.user && uid === state.user.uid) userVote = p.votes[uid];
          }
        }
      }

      html += '<div class="poll-card">';
      html += '<strong>/' + esc(p.slug) + '/ &mdash; ' + esc(p.title) + '</strong> ';
      html += '<span class="admin-badge" style="background-color:' + (p.status === "approved" ? "#117743" : "#800000") + ';">' +
              (p.status === "approved" ? "CREATED" : "OPEN POLL") + '</span><br>';
      if (p.description) {
        html += '<div style="margin:4px 0;">' + esc(p.description) + '</div>';
      }
      html += '<div class="muted">Proposed by ' + esc(p.creatorName || "User") + ' &bull; Agree: <strong>' + yesCount + '</strong> | Disagree: <strong>' + noCount + '</strong></div>';

      if (p.status !== "approved") {
        html += '<div style="margin-top:6px;">';
        html += '<button onclick="voteOnPoll(\'' + esc(p.slug) + '\', \'yes\')">Agree (' + yesCount + ')</button> ';
        html += '<button onclick="voteOnPoll(\'' + esc(p.slug) + '\', \'no\')">Disagree (' + noCount + ')</button>';
        if (userVote) {
          html += ' <span class="muted">(Your vote: ' + esc(userVote.toUpperCase()) + ')</span>';
        }
        html += '</div>';
      } else {
        html += '<div style="margin-top:6px;"><a onclick="switchView(\'board\', \'' + esc(p.slug) + '\')">Open /' + esc(p.slug) + '/ Board &rarr;</a></div>';
      }
      html += '</div>';
    }
  }
  if (!hasPolls) {
    html += '<div style="text-align:center;">No board polls created yet.</div>';
  }
  html += '</div>';
  return html;
}

function renderProfileView() {
  if (!state.user) {
    return '<div class="box-panel">Please <a onclick="switchView(\'auth\')">Log In</a> to view your profile.</div>';
  }
  var avatarSrc = state.profile.avatarUrl || "";
  var html = '<div class="board-banner">User Profile</div>';
  html += '<div class="box-panel">';
  html += '<h3>Account &amp; Avatar Settings</h3>';
  html += '<table class="form-table">';
  html += '<tr><td class="form-label">Name</td><td><strong>' + esc(state.user.username) + '</strong>' +
          (state.user.isAdmin ? ' <span class="admin-badge">ADMIN</span>' : '') + '</td></tr>';
  html += '<tr><td class="form-label">Account Email</td><td>' + esc(state.user.email) + '</td></tr>';
  html += '<tr><td class="form-label">Current Avatar</td><td>' +
          (avatarSrc ? '<img class="avatar-large" src="' + esc(avatarSrc) + '" alt="Avatar">' : '<span class="muted">No avatar uploaded</span>') +
          '</td></tr>';
  html += '<tr><td class="form-label">Upload Avatar</td><td><input type="file" id="profAvatarFile" accept="image/*"></td></tr>';
  html += '<tr><td class="form-label">Display Name</td><td><input type="text" id="profNickname" maxlength="32" value="' + esc(state.profile.nickname) + '"></td></tr>';
  html += '<tr><td class="form-label">Bio / Region</td><td><textarea id="profBio" placeholder="e.g. Odesa / Tiraspol">' + esc(state.profile.bio) + '</textarea></td></tr>';
  html += '<tr><td class="form-label">Save</td><td><button onclick="saveUserProfile()">Save Profile</button></td></tr>';
  html += '</table>';
  html += '</div>';
  return html;
}

function renderAuthView() {
  var html = '<div class="board-banner">Account Login &amp; Registration</div>';
  html += '<div class="box-panel">';
  html += '<h3>Sign In or Create an Account</h3>';
  html += '<table class="form-table">';
  html += '<tr><td class="form-label">Your Name</td><td><input type="text" id="authUsername" maxlength="30" placeholder="e.g. alex"></td></tr>';
  html += '<tr><td class="form-label">Password</td><td><input type="password" id="authPassword" placeholder="Enter password"></td></tr>';
  html += '<tr><td class="form-label">Action</td><td>' +
          '<button onclick="handleAuth(\'login\')">Login</button> &nbsp; ' +
          '<button onclick="handleAuth(\'register\')">Register New Account</button>' +
          '</td></tr>';
  html += '</table>';
  html += '<div class="muted" style="margin-top:8px;">Enter a name (for example: <strong>alex</strong>) and a password. Your account is saved in Firebase as <strong>alex@' + esc(CONFIG.emailDomain) + '</strong>.</div>';
  html += '</div>';
  return html;
}

function renderAll() {
  renderTopNav();
  var container = document.getElementById("mainContent");
  if (state.view === "thread") {
    container.innerHTML = renderSingleThreadView();
  } else if (state.view === "polls") {
    container.innerHTML = renderPollsView();
  } else if (state.view === "profile") {
    container.innerHTML = renderProfileView();
  } else if (state.view === "auth") {
    container.innerHTML = renderAuthView();
  } else {
    container.innerHTML = renderBoardView();
  }
}

/* ==========================================================================
   INITIALIZATION
   ========================================================================== */
window.onload = function() {
  loadSession();
  ensureFreshSession(function() {
    loadUserProfile(function() {
      refreshAllData(renderAll);
    });
  });
};
</script>
</body>
</html>
